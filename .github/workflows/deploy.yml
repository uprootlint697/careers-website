name: Build & deploy careers site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6h: pick up new/closed roles from Ashby
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate role pages from Ashby
        run: node scripts/build-roles.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html CNAME .nojekyll robots.txt sitemap.xml assets roles _site/
          ls -R _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
